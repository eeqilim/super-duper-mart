<mat-card class="form-card">
    <mat-card-title>{{ title }}</mat-card-title>

    <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" class="product-form">
            <mat-form-field appearance="outline">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" />
                <mat-error>Name is required</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Description</mat-label>
                <textarea matInput formControlName="description" rows="3"></textarea>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Quantity</mat-label>
                <input matInput type="number" formControlName="quantity" />
                <mat-error>Quantity must be 0 or greater</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Retail Price</mat-label>
                <input matInput type="number" formControlName="retailPrice" />
                <mat-error>Retail price must be 0 or greater</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Wholesale Price</mat-label>
                <input matInput type="number" formControlName="wholesalePrice" />
                <mat-error>Wholesale price must be 0 or greater</mat-error>
            </mat-form-field>

            <div class="form-actions">
                <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
                    {{ submitLabel }}
                </button>

                <button mat-stroked-button type="button" (click)="cancel()">
                    Cancel
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
